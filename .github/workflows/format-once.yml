name: Format once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/format-once.yml'

permissions:
  contents: write

jobs:
  format:
    name: Apply Prettier and commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format homepage
        run: pnpm exec prettier --write app/page.tsx

      - name: Commit formatted homepage and remove temporary workflow
        run: |
          rm .github/workflows/format-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx .github/workflows/format-once.yml
          git diff --cached --check
          git commit -m "fix(format): apply Prettier to homepage"
          git push
