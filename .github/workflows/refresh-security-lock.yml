name: Refresh security lock

on:
  push:
    branches:
      - fix/seo-audit-2026-09-10
    paths:
      - .github/workflows/refresh-security-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/seo-audit-2026-09-10
      - uses: pnpm/action-setup@v5
        with:
          version: 11.1.3
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Refresh lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit refreshed lockfile and remove helper
        shell: bash
        run: |
          rm .github/workflows/refresh-security-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml .github/workflows/refresh-security-lock.yml
          git commit -m "chore(deps): refresh lockfile for sharp 0.35.4"
          git push origin HEAD:fix/seo-audit-2026-09-10
