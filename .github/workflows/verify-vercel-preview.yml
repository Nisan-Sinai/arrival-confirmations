name: Verify Vercel Preview in GitHub Deployments

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  preview-deployment:
    name: Verify active Preview deployment
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      statuses: read
      deployments: write
    uses: Nisan-Sinai/github-workflows/.github/workflows/vercel-preview-deployment.yml@c1c2dd6f344e7bb9626d4a57885bfd0d277cd0eb # main
    with:
      vercel-context: Vercel
      expected-project-path: nisan-sinai-projects/arrival-confirmations
      timeout-seconds: 720
