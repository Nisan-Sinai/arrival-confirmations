name: Verify Vercel Preview in GitHub Deployments

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  preview-deployment:
    name: Verify active Preview deployment
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      statuses: read
      deployments: write
    uses: Nisan-Sinai/github-workflows/.github/workflows/vercel-preview-deployment.yml@4785c2f8c13f9b81fc3507069e94aa2f9c22d752 # main
    with:
      vercel-context: Vercel
      expected-project-path: nisan-sinai-projects/arrival-confirmations
      timeout-seconds: 720
