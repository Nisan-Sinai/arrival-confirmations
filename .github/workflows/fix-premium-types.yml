name: Fix Premium TypeScript issues

on:
  push:
    branches:
      - feat/complete-premium-event-tools

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/complete-premium-event-tools
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply the two compiler fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          route = Path('app/api/cron/whatsapp-reminders/route.ts')
          route.write_text(
              route.read_text().replace(
                  'const message = raw as DueMessageRow;',
                  'const message = raw as unknown as DueMessageRow;',
              )
          )

          test = Path('tests/unit/lib/guestImport.test.ts')
          test.write_text(
              test.read_text().replace(
                  "mockImplementation(function (key) {",
                  "mockImplementation(function <K, V>(this: Map<K, V>, key: K): V | undefined {",
              )
          )
          PY
          pnpm format

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git diff --cached --quiet || git commit -m "fix(types): align relation cast and generic map mock"
          git push origin HEAD:feat/complete-premium-event-tools
