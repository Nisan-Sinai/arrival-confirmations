name: Isolated HTTP load QA

on:
  pull_request:
    paths:
      - '.github/workflows/load-test.yml'
      - 'scripts/load-test.mjs'
      - 'tests/load/**'
      - 'docs/LOAD-TEST.md'
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 0'

permissions:
  contents: read

concurrency:
  group: isolated-load-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  load:
    uses: Nisan-Sinai/github-workflows/.github/workflows/isolated-load-qa.yml@2f3a7462d8ee740c5838210626d94c4fd294e1a2 # main
    with:
      node-version: '24'
      safety-command: node --test tests/load/load-test.test.mjs
      build-command: pnpm build
      start-command: pnpm start
      load-command: node scripts/load-test.mjs
