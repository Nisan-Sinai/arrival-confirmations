name: One-shot preview formatting
on:
  push:
    branches:
      - feature/premium-rsvp-experience-20261104
    paths:
      - .github/workflows/one-shot-format-preview.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.28.5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write features/landing/LandingPage.tsx features/landing/InteractiveRsvpDemo.tsx e2e/interactive-rsvp-demo.spec.ts
      - name: Commit formatting only
        run: |
          if git diff --quiet -- features/landing/LandingPage.tsx features/landing/InteractiveRsvpDemo.tsx e2e/interactive-rsvp-demo.spec.ts; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add features/landing/LandingPage.tsx features/landing/InteractiveRsvpDemo.tsx e2e/interactive-rsvp-demo.spec.ts
          git commit -m "style: apply project Prettier formatting to premium preview"
          git push origin HEAD:refs/heads/feature/premium-rsvp-experience-20261104
