name: Format QA pull request

on:
  pull_request:

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format affected files
        run: >-
          pnpm exec prettier --write
          app/dashboard/layout.tsx
          app/pricing/page.tsx
          e2e/commercial-consistency.spec.ts
          features/admin/VisualSeatingFloor.tsx

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/dashboard/layout.tsx app/pricing/page.tsx e2e/commercial-consistency.spec.ts features/admin/VisualSeatingFloor.tsx
          git commit -m "style: format QA changes"
          git push
