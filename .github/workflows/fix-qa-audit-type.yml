name: Fix QA audit UUID cast

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'qa/50-event-matrix' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Add explicit UUID casts
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/integration/fiftyEventMatrix.test.ts')
          text = path.read_text()
          old = """       ($1, 'event_license_updated', 'event_license', $2,\n        jsonb_build_object(\n          'event_id', $2::text,"""
          new = """       ($1::uuid, 'event_license_updated', 'event_license', $2::uuid,\n        jsonb_build_object(\n          'event_id', ($2::uuid)::text,"""
          if old not in text:
              raise SystemExit('Expected audit query was not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/integration/fiftyEventMatrix.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "test: cast audit event id consistently"
          git push origin HEAD:${{ github.head_ref }}
