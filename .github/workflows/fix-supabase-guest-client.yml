name: Fix Supabase guest client types

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feature/admin-customer-event-access'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Use the project server-side Supabase compatibility pattern
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path: str, replacements: list[tuple[str, str]]) -> None:
              file = Path(path)
              source = file.read_text()
              for old, new in replacements:
                  if old not in source:
                      raise SystemExit(f'missing replacement in {path}: {old[:100]!r}')
                  source = source.replace(old, new)
              file.write_text(source)

          files_with_server_actions = [
              'app/actions/adminGuestFileImport.ts',
              'app/actions/adminGuestImports.ts',
              'app/actions/manageAdminCustomerEvent.ts',
              'app/actions/manageGuests.ts',
          ]
          for path in files_with_server_actions:
              file = Path(path)
              source = file.read_text()
              marker = "import { redirect } from 'next/navigation';\n"
              if "from '@supabase/supabase-js'" not in source:
                  source = source.replace(marker, marker + "import type { SupabaseClient } from '@supabase/supabase-js';\n")
              source = source.replace('GuestSupabaseClient', 'SupabaseClient')
              source = source.replace('TypedSupabaseClient', 'SupabaseClient')
              source = source.replace(
                  "import type { GuestInsert, SupabaseClient } from '@/types/guestDatabase.types';",
                  "import type { GuestInsert } from '@/types/guestDatabase.types';",
              )
              source = source.replace(
                  "import type { SupabaseClient, GuestUpdate } from '@/types/guestDatabase.types';",
                  "import type { GuestUpdate } from '@/types/guestDatabase.types';",
              )
              source = source.replace(
                  "import type { GuestInsert, SupabaseClient, GuestUpdate } from '@/types/guestDatabase.types';",
                  "import type { GuestInsert, GuestUpdate } from '@/types/guestDatabase.types';",
              )
              file.write_text(source)

          for path, marker in [
              ('app/admin/events/[id]/page.tsx', "import { notFound } from 'next/navigation';\n"),
              ('app/dashboard/events/[id]/guests/page.tsx', "import { notFound, redirect } from 'next/navigation';\n"),
          ]:
              file = Path(path)
              source = file.read_text()
              if "from '@supabase/supabase-js'" not in source:
                  source = source.replace(marker, marker + "import type { SupabaseClient } from '@supabase/supabase-js';\n")
              source = source.replace("import type { GuestSupabaseClient } from '@/types/guestDatabase.types';\n", '')
              source = source.replace('GuestSupabaseClient', 'SupabaseClient')
              file.write_text(source)

          current = Path('lib/server/currentInvite.ts')
          source = current.read_text()
          marker = "import { cookies } from 'next/headers';\n"
          if "from '@supabase/supabase-js'" not in source:
              source = source.replace(marker, marker + "import type { SupabaseClient } from '@supabase/supabase-js';\n")
          source = source.replace("import type { GuestSupabaseClient } from '@/types/guestDatabase.types';\n", '')
          source = source.replace('GuestSupabaseClient', 'SupabaseClient')
          current.write_text(source)

          Path('types/guestDatabase.types.ts').write_text("""import type { Database } from '@/types/database.types';

export interface GuestInsert {
  readonly accessibility_needs?: string | null;
  readonly created_at?: string;
  readonly email?: string | null;
  readonly event_id: string;
  readonly family_side?: Database['public']['Enums']['family_side'] | null;
  readonly full_name: string;
  readonly id?: string;
  readonly import_source?: string | null;
  readonly invite_token_hash?: string | null;
  readonly is_active?: boolean;
  readonly meal_preference?: string | null;
  readonly notes?: string | null;
  readonly party_size?: number;
  readonly phone: string;
  readonly phone_normalized: string;
  readonly seat_locked?: boolean;
  readonly seat_number?: string | null;
  readonly seating_group?: string | null;
  readonly seating_priority?: number;
  readonly table_id?: string | null;
  readonly table_name?: string | null;
  readonly token_expires_at?: string | null;
  readonly token_revoked_at?: string | null;
  readonly updated_at?: string;
}

export interface GuestUpdate {
  readonly accessibility_needs?: string | null;
  readonly created_at?: string;
  readonly email?: string | null;
  readonly event_id?: string;
  readonly family_side?: Database['public']['Enums']['family_side'] | null;
  readonly full_name?: string;
  readonly id?: string;
  readonly import_source?: string | null;
  readonly invite_token_hash?: string | null;
  readonly is_active?: boolean;
  readonly meal_preference?: string | null;
  readonly notes?: string | null;
  readonly party_size?: number;
  readonly phone?: string;
  readonly phone_normalized?: string;
  readonly seat_locked?: boolean;
  readonly seat_number?: string | null;
  readonly seating_group?: string | null;
  readonly seating_priority?: number;
  readonly table_id?: string | null;
  readonly table_name?: string | null;
  readonly token_expires_at?: string | null;
  readonly token_revoked_at?: string | null;
  readonly updated_at?: string;
}
""")
          PY
      - run: >-
          pnpm exec prettier --write
          app/actions/adminGuestFileImport.ts
          app/actions/adminGuestImports.ts
          app/actions/manageAdminCustomerEvent.ts
          app/actions/manageGuests.ts
          app/admin/events/[id]/page.tsx
          app/dashboard/events/[id]/guests/page.tsx
          lib/server/currentInvite.ts
          types/guestDatabase.types.ts
      - name: Commit client compatibility fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app lib types/guestDatabase.types.ts
          git commit -m "fix: use untyped server Supabase client for guest extensions"
          git push origin HEAD:${{ github.head_ref }}
