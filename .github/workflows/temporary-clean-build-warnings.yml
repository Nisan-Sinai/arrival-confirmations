name: Temporary clean build warnings

on:
  push:
    branches:
      - fix/build-warning-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/build-warning-cleanup
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Update configuration and lockfile
        run: |
          python - <<'PY'
          from pathlib import Path

          vitest = Path('vitest.config.ts')
          text = vitest.read_text()
          text = text.replace("import tsconfigPaths from 'vite-tsconfig-paths';\n", '')
          text = text.replace('plugins: [tsconfigPaths(), react()],', 'plugins: [react()],')
          text = text.replace("resolve: {\n    alias:", "resolve: {\n    tsconfigPaths: true,\n    alias:")
          vitest.write_text(text)

          knip = Path('knip.json')
          text = knip.read_text().replace('"project": ["**/*.{ts,tsx}",', '"project": ["**/*.{ts,tsx,css}",')
          knip.write_text(text)
          PY
          pnpm install --lockfile-only
          pnpm exec prettier --write package.json vitest.config.ts knip.json
      - name: Commit generated cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml vitest.config.ts knip.json
          git diff --cached --quiet || git commit -m "fix(build): remove build warning sources"
          git push origin HEAD:fix/build-warning-cleanup
