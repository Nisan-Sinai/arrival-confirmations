name: Fix QA regression expectation

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix-test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - name: Update the structured-data regression test
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('e2e/invitation.spec.ts')
          text = path.read_text()
          old = """    expect(app?.offers).toMatchObject([
                { name: 'Basic', price: '99', priceCurrency: 'ILS' },
                { name: 'Premium', price: '199', priceCurrency: 'ILS' },
              ]);
          """
          new = """    expect(app?.offers).toMatchObject([
                { name: 'Basic', price: '99', priceCurrency: 'ILS' },
                { name: 'Premium', price: '199', priceCurrency: 'ILS' },
                { name: 'Pro', price: '349', priceCurrency: 'ILS' },
              ]);
          """
          if old not in text:
              raise SystemExit('Expected structured-data assertion was not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit the regression-test fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/invitation.spec.ts
          git commit -m "test: include Pro in structured-data expectation"
          git push
