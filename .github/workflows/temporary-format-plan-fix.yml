name: Temporary format plan fix

on:
  push:
    branches:
      - fix/admin-plan-change-qa

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-plan-change-qa
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write app/_lib/licenseChange.ts app/admin/plans/page.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/_lib/licenseChange.ts app/admin/plans/page.tsx
          git diff --cached --quiet || git commit -m "style: format admin plan fix"
          git push origin HEAD:fix/admin-plan-change-qa
