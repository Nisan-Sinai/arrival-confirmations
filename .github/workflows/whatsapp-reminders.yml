name: Temporary Premium formatter

on:
  pull_request:

jobs:
  format-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write features/admin/PremiumWhatsAppCampaign.tsx
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-premium-campaign
          path: features/admin/PremiumWhatsAppCampaign.tsx
          retention-days: 1
