name: Format client home link

on:
  push:
    branches:
      - feat/client-home-link-everywhere

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/client-home-link-everywhere
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format dashboard layout
        run: pnpm exec prettier --write app/dashboard/layout.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/dashboard/layout.tsx
          git diff --cached --quiet || git commit -m "style: format client home link"
          git diff HEAD^ --quiet || git push
