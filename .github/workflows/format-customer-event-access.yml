name: Format customer event access

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feature/admin-customer-event-access'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec prettier --write
          app/actions/adminGuestFileImport.ts
          app/actions/adminGuestImports.ts
          app/actions/manageAdminCustomerEvent.ts
          app/actions/manageGuests.ts
          app/actions/submitPersonalRsvp.ts
          app/admin/events/[id]/edit/page.tsx
          app/admin/events/[id]/page.tsx
          app/admin/events/page.tsx
          app/dashboard/events/[id]/guests/page.tsx
          app/invite/[token]/route.ts
          app/invite/page.tsx
          features/admin/GuestFileImportForm.tsx
          features/admin/GuestManagementPanel.tsx
          features/admin/PersonalInviteSendList.tsx
          features/rsvp/PersonalRsvpButtons.tsx
          lib/server/currentInvite.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app features lib
          git commit -m "style: format customer event access"
          git push origin HEAD:${{ github.head_ref }}
