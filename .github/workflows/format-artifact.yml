name: Format artifact

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed files
        run: >-
          pnpm exec prettier --write
          'app/dashboard/events/[id]/guests/page.tsx'
          app/error.tsx
          features/admin/GuestManagementPanel.tsx
          features/admin/ShareInvitation.tsx
          tests/component/GuestManagementPanel.test.tsx
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/dashboard/events/[id]/guests/page.tsx' app/error.tsx features/admin/GuestManagementPanel.tsx features/admin/ShareInvitation.tsx tests/component/GuestManagementPanel.test.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: format QA changes"
            git push
          fi
