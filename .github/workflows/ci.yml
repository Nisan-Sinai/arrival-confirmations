name: CI

# §11: every push and every pull request. A gate that only runs on one of them is a
# gate somebody will route around.
on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Deterministic stand-ins so the suites that need no database still run in a fork,
  # where secrets are unavailable. Obviously fake, and never valid anywhere.
  NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key-0123456789
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-0123456789
  TOKEN_PEPPER: ci-placeholder-token-pepper-0123456789-abcdef
  IP_HASH_PEPPER: ci-placeholder-ip-pepper-9876543210-zyxwvu

jobs:
  quality:
    name: Format, lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Pinned rather than 'latest': §1 requires the toolchain to be reproducible.
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # Frozen: a lockfile CI is allowed to update is a lockfile that proves nothing.
        run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm format:check

      - name: ESLint
        run: pnpm lint

      - name: TypeScript
        run: pnpm typecheck

      # `pnpm test:coverage` rather than `pnpm test`: it runs the same specs and also
      # enforces the thresholds in vitest.config.ts. The gate was declared in the
      # README and never invoked here, so the suite sat at 32% against a stated 100%
      # for the life of the project without anything reporting it.
      - name: Unit and component tests, with coverage thresholds
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Browser bundle security tests
        # The suite inspects .next/static, so it must run in the same job after Build.
        run: pnpm test:security

      # A hard gate, not advisory. This is how `updatePasswordAction`,
      # `updateRsvpAction` and an entire `/reset-password` flow came to exist with no
      # caller and no route, and how six unused production dependencies — including
      # recharts and react-hook-form — stayed in the manifest. It exits clean today,
      # so anything it reports tomorrow is new.
      - name: Dead code and unused exports
        run: pnpm deadcode

      - name: Secret scan over source and build output
        # Runs after the build on purpose: §4.5's browser-bundle grep has nothing to
        # inspect until .next exists.
        run: pnpm scan:secrets

      - name: Dependency audit
        # Advisory: a transitive advisory with no fix available should not block a
        # release that does not reach the vulnerable path. It is still reported.
        run: pnpm audit --audit-level high
        continue-on-error: true

  migrations:
    name: Database, integration, RLS and 50-event matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A fresh local Supabase database is safer and more deterministic than an
      # optional remote connection string. Every migration is replayed in order, so a
      # missing object or an invalid migration fails the pull request without secrets.
      - uses: supabase/setup-cli@v2
        with:
          version: 2.101.0
          github-token: ${{ github.token }}

      - name: Initialize local Supabase configuration
        run: supabase init

      - name: Start clean database and apply every migration
        run: supabase db start

      - name: Export local database connection
        run: |
          eval "$(supabase status -o env)"
          echo "DB_URL=$DB_URL" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=$DB_URL" >> "$GITHUB_ENV"

      - name: Compare repository migrations with applied history
        run: pnpm check:schema-drift

      - name: Integration tests including the 50-event matrix
        run: pnpm test:integration

      - name: Row-level security tests
        run: pnpm test:rls

      - name: Stop local database
        if: always()
        run: supabase stop --no-backup

  e2e:
    name: End-to-end and accessibility
    runs-on: ubuntu-latest
    # Needs real credentials, which forks cannot have. Skipping is honest; faking a
    # pass would not be (§17).
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Check whether E2E credentials are configured
        id: creds
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::E2E skipped - repository secrets are not set."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build for the E2E server
        if: steps.creds.outputs.configured == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOKEN_PEPPER: ${{ secrets.TOKEN_PEPPER }}
          IP_HASH_PEPPER: ${{ secrets.IP_HASH_PEPPER }}
        # playwright.config.ts starts `next start` in CI, which needs this.
        run: pnpm build

      - name: Run E2E and axe
        if: steps.creds.outputs.configured == 'true'
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOKEN_PEPPER: ${{ secrets.TOKEN_PEPPER }}
          IP_HASH_PEPPER: ${{ secrets.IP_HASH_PEPPER }}
          E2E_EVENT_PUBLIC_ID: ${{ secrets.E2E_EVENT_PUBLIC_ID }}
        run: pnpm test:e2e

      - name: Upload the report when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  production-schema-diagnostic:
    name: Production schema credential diagnostic
    if: github.event_name == 'pull_request' && github.head_ref == 'ops/production-schema-release-20260802'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v2
        with:
          version: 2.101.0
          github-token: ${{ github.token }}

      - name: Detect safe Production migration credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          present() {
            if [ -n "${!1:-}" ]; then
              echo "✅ $1 is configured"
            else
              echo "⚪ $1 is not configured"
            fi
          }

          present SUPABASE_URL
          present SUPABASE_ACCESS_TOKEN
          present SUPABASE_DB_PASSWORD
          present SUPABASE_DB_URL
          present DATABASE_URL
          present TEST_DATABASE_URL
          present SUPABASE_PROJECT_REF
          present SUPABASE_PROJECT_ID

          if [ -n "${SUPABASE_DB_URL:-}" ] || [ -n "${DATABASE_URL:-}" ] || [ -n "${TEST_DATABASE_URL:-}" ]; then
            echo "Selected safe migration path: db_url"
          elif [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] && [ -n "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "Selected safe migration path: linked_cli"
          elif [ -n "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "Selected safe migration path: management_api"
          else
            echo "Selected safe migration path: none"
          fi
