name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key-0123456789
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-0123456789
  TOKEN_PEPPER: ci-placeholder-token-pepper-0123456789-abcdef
  IP_HASH_PEPPER: ci-placeholder-ip-pepper-9876543210-zyxwvu

jobs:
  history-secrets:
    name: Full Git history secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Install Gitleaks and scan the pull-request range
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

      - name: Scan every commit in repository history
        run: gitleaks git --redact --verbose .

  dependency-audit:
    name: Production and full dependency audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies from the lockfile
        run: pnpm install --frozen-lockfile

      - name: Production dependency audit
        run: pnpm audit --prod

      - name: Full dependency audit
        run: pnpm audit

  quality:
    name: Format, lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm format:check

      - name: ESLint
        run: pnpm lint

      - name: TypeScript
        run: pnpm typecheck

      - name: Unit and component tests, with coverage thresholds
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Browser bundle security tests
        run: pnpm test:security

      - name: Dead code and unused exports
        run: pnpm deadcode

      - name: Secret scan over source and build output
        run: pnpm scan:secrets

  migrations:
    name: Database, integration, RLS and 50-event matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.101.0
          github-token: ${{ github.token }}

      - name: Initialize local Supabase configuration
        run: supabase init

      - name: Start clean database and apply every migration
        run: supabase db start

      - name: Export local database connection
        run: |
          eval "$(supabase status -o env)"
          echo "DB_URL=$DB_URL" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=$DB_URL" >> "$GITHUB_ENV"

      - name: Compare repository migrations with applied history
        run: pnpm check:schema-drift

      - name: Integration tests including the 50-event matrix
        run: pnpm test:integration

      - name: Row-level security tests
        run: pnpm test:rls

      - name: Stop local database
        if: always()
        run: supabase stop --no-backup

  e2e:
    name: End-to-end and accessibility
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # GitHub withholds repository secrets from Dependabot-triggered workflows — they
      # live in a separate Dependabot secrets store. The job's `if:` above treats "not a
      # fork" as "secrets are available", which is true for every branch except
      # Dependabot's, so every dependency PR failed the credential check below for a
      # reason that had nothing to do with the dependencies. All three open ones were red
      # on arrival, and the `Dependabot auto-merge gate` could never pass.
      #
      # The fix is not to skip the job. Measured locally with nothing but the placeholder
      # values in this file's `env` block, the suite runs **66 tests and skips 11** —
      # exactly what it does with real credentials. Only the live-invitation tests need
      # secrets, and `e2e/invitation.spec.ts` already skips those on a per-test basis
      # rather than abandoning the file. So a Dependabot run gets the whole public
      # surface, every axe check and every layout assertion, and only loses the eleven
      # that need a real event.
      - name: Decide whether this run can have credentials
        id: creds
        run: |
          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Dependabot run — GitHub withholds repository secrets, so the E2E suite runs against placeholders and the live-invitation tests skip."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      # Still a hard failure everywhere secrets are supposed to exist. The point of this
      # step is that a run must never look green while silently testing nothing, and that
      # is unchanged for pushes to main and for human pull requests.
      - name: Require E2E credentials on runs that should have them
        if: steps.creds.outputs.available == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOKEN_PEPPER: ${{ secrets.TOKEN_PEPPER }}
          IP_HASH_PEPPER: ${{ secrets.IP_HASH_PEPPER }}
          E2E_EVENT_PUBLIC_ID: ${{ secrets.E2E_EVENT_PUBLIC_ID }}
        run: |
          missing=0
          for name in SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY TOKEN_PEPPER IP_HASH_PEPPER E2E_EVENT_PUBLIC_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Required E2E secret ${name} is not configured."
              missing=1
            fi
          done
          exit "$missing"

      # Promote the real credentials into the environment, or leave the workflow-level
      # `env:` placeholders at the top of this file standing.
      #
      # The first version of this wrote `secrets.X || 'ci-placeholder-…'` inline on each
      # step, which was a second copy of values this file already defines — and gitleaks
      # rightly flagged the copies as `generic-api-key` at entropy 4.4, because an inline
      # quoted high-entropy string is exactly what a leaked key looks like. Overriding
      # only when there is something to override keeps one definition of the placeholders
      # and adds no literal the scanner has to be taught to ignore.
      - name: Export credentials when this run has them
        if: steps.creds.outputs.available == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PEPPER_TOKEN: ${{ secrets.TOKEN_PEPPER }}
          PEPPER_IP: ${{ secrets.IP_HASH_PEPPER }}
          EVENT_PUBLIC_ID: ${{ secrets.E2E_EVENT_PUBLIC_ID }}
        run: |
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}"
            echo "TOKEN_PEPPER=${PEPPER_TOKEN}"
            echo "IP_HASH_PEPPER=${PEPPER_IP}"
            echo "E2E_EVENT_PUBLIC_ID=${EVENT_PUBLIC_ID}"
          } >> "$GITHUB_ENV"

      # No `env:` on either step below. They read whatever the step above exported, or
      # the workflow-level placeholders when it did not run. `E2E_EVENT_PUBLIC_ID` is
      # simply absent on a Dependabot run, which is the signal `invitation.spec.ts` reads
      # to skip the eleven tests that need a real event — inventing a value there would
      # turn eleven honest skips into eleven confusing failures.
      - name: Build for the E2E server
        run: pnpm build

      - name: Run E2E and axe
        run: pnpm test:e2e

      - name: Upload the report when something failed
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
