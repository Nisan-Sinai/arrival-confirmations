name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key-0123456789
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-0123456789
  TOKEN_PEPPER: ci-placeholder-token-pepper-0123456789-abcdef
  IP_HASH_PEPPER: ci-placeholder-ip-pepper-9876543210-zyxwvu

jobs:
  history-secrets:
    name: Full Git history secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Install Gitleaks and scan the pull-request range
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'

      - name: Scan every commit in repository history
        run: gitleaks git --redact --verbose .

  dependency-audit:
    name: Production and full dependency audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies from the lockfile
        run: pnpm install --frozen-lockfile

      - name: Production dependency audit
        run: pnpm audit --prod

      - name: Full dependency audit
        run: pnpm audit

  quality:
    name: Format, lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prettier
        run: pnpm format:check

      - name: ESLint
        run: pnpm lint

      - name: TypeScript
        run: pnpm typecheck

      - name: Unit and component tests, with coverage thresholds
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Browser bundle security tests
        run: pnpm test:security

      - name: Dead code and unused exports
        run: pnpm deadcode

      - name: Secret scan over source and build output
        run: pnpm scan:secrets

  migrations:
    name: Database, integration, RLS and 50-event matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.101.0
          github-token: ${{ github.token }}

      - name: Initialize local Supabase configuration
        run: supabase init

      - name: Start clean database and apply every migration
        run: supabase db start

      - name: Export local database connection
        run: |
          eval "$(supabase status -o env)"
          echo "DB_URL=$DB_URL" >> "$GITHUB_ENV"
          echo "TEST_DATABASE_URL=$DB_URL" >> "$GITHUB_ENV"

      - name: Compare repository migrations with applied history
        run: pnpm check:schema-drift

      - name: Integration tests including the 50-event matrix
        run: pnpm test:integration

      - name: Row-level security tests
        run: pnpm test:rls

      - name: Stop local database
        if: always()
        run: supabase stop --no-backup

  maintenance-lockfile:
    name: Generate patched lockfile artifact
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'security/devsecops-hardening-2026-08-20'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Resolve lockfile only without lifecycle scripts
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts

      - name: Upload generated lockfile without repository write permission
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: patched-lockfile
          path: pnpm-lock.yaml
          retention-days: 1

  maintenance-publish:
    name: Publish patched lockfile artifact
    needs: maintenance-lockfile
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'security/devsecops-hardening-2026-08-20'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout only the trusted same-repository head branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Download generated lockfile
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: patched-lockfile
          path: maintenance-lockfile

      - name: Copy and fast-forward push the lockfile only
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          cp maintenance-lockfile/pnpm-lock.yaml pnpm-lock.yaml
          git add -- pnpm-lock.yaml
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo 'No lockfile change to publish.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(deps): refresh patched transitive lockfile'
          git push origin "HEAD:${HEAD_REF}"

  e2e:
    name: End-to-end and accessibility
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event.pull_request.head.repo.fork == false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Require E2E credentials on trusted runs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOKEN_PEPPER: ${{ secrets.TOKEN_PEPPER }}
          IP_HASH_PEPPER: ${{ secrets.IP_HASH_PEPPER }}
          E2E_EVENT_PUBLIC_ID: ${{ secrets.E2E_EVENT_PUBLIC_ID }}
        run: |
          missing=0
          for name in SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY TOKEN_PEPPER IP_HASH_PEPPER E2E_EVENT_PUBLIC_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Required E2E secret ${name} is not configured."
              missing=1
            fi
          done
          exit "$missing"

      - name: Build for the E2E server
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOKEN_PEPPER: ${{ secrets.TOKEN_PEPPER }}
          IP_HASH_PEPPER: ${{ secrets.IP_HASH_PEPPER }}
        run: pnpm build

      - name: Run E2E and axe
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TOKEN_PEPPER: ${{ secrets.TOKEN_PEPPER }}
          IP_HASH_PEPPER: ${{ secrets.IP_HASH_PEPPER }}
          E2E_EVENT_PUBLIC_ID: ${{ secrets.E2E_EVENT_PUBLIC_ID }}
        run: pnpm test:e2e

      - name: Upload the report when something failed
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
