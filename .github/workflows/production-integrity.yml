name: Production integrity

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: production-integrity
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  verify-production:
    name: Public domain serves the merged release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Mark production verification as pending
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$(printf '{\"state\":\"pending\",\"context\":\"Production integrity\",\"description\":\"Waiting for the public domain to serve this release\",\"target_url\":\"%s\"}' "${STATUS_TARGET_URL}")"

      - name: Verify the exact merged release after deployment
        id: verify
        if: github.event_name == 'push'
        env:
          PRODUCTION_URL: https://arrival-confirmations.vercel.app
          EXPECTED_SHA: ${{ github.sha }}
          VERIFY_ATTEMPTS: '36'
          VERIFY_INTERVAL_MS: '10000'
        run: node scripts/verify-production.mjs

      - name: Publish production verification result
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "${VERIFY_OUTCOME}" = 'success' ]; then
            state='success'
            description='Public domain serves the exact merged release'
          else
            state='failure'
            description='Public domain does not serve the expected release'
          fi

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$(printf '{\"state\":\"%s\",\"context\":\"Production integrity\",\"description\":\"%s\",\"target_url\":\"%s\"}' "${state}" "${description}" "${STATUS_TARGET_URL}")"

      - name: Scheduled production smoke test
        if: github.event_name != 'push'
        env:
          PRODUCTION_URL: https://arrival-confirmations.vercel.app
          VERIFY_ATTEMPTS: '1'
        run: node scripts/verify-production.mjs
