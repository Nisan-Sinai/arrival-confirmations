name: Production integrity

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: production-integrity
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  production-pending:
    name: Mark production verification as pending
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      statuses: write
    steps:
      - name: Mark production verification as pending
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$(printf '{\"state\":\"pending\",\"context\":\"Production integrity\",\"description\":\"Waiting for the public domain to serve this release\",\"target_url\":\"%s\"}' "${STATUS_TARGET_URL}")"

  verify-production:
    name: Public domain serves the merged release
    needs: production-pending
    if: ${{ !cancelled() && (github.event_name != 'push' || needs.production-pending.result == 'success') }}
    uses: Nisan-Sinai/github-workflows/.github/workflows/production-qa.yml@c1c2dd6f344e7bb9626d4a57885bfd0d277cd0eb # main
    with:
      node-version: '24'
      production-url: https://arrival-confirmations.vercel.app
      # Scheduled/manual smoke checks also require this ref's exact release now.
      expected-sha: ${{ github.sha }}
      verify-command: >-
        VERIFY_ATTEMPTS=${{ github.event_name == 'push' && '36' || '1' }}
        VERIFY_INTERVAL_MS=10000
        node scripts/verify-production.mjs

  production-result:
    name: Publish production verification result
    needs: [production-pending, verify-production]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      statuses: write
    steps:
      - name: Publish production verification result
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_OUTCOME: ${{ needs.verify-production.result }}
          STATUS_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "${VERIFY_OUTCOME}" = 'success' ]; then
            state='success'
            description='Public domain serves the exact merged release'
          else
            state='failure'
            description='Public domain does not serve the expected release'
          fi

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "$(printf '{\"state\":\"%s\",\"context\":\"Production integrity\",\"description\":\"%s\",\"target_url\":\"%s\"}' "${state}" "${description}" "${STATUS_TARGET_URL}")"
