name: Production integrity

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: production-integrity
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-production:
    name: Public domain serves the merged release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify the exact merged release after deployment
        if: github.event_name == 'push'
        env:
          PRODUCTION_URL: https://arrival-confirmations.vercel.app
          EXPECTED_SHA: ${{ github.sha }}
          VERIFY_ATTEMPTS: '36'
          VERIFY_INTERVAL_MS: '10000'
        run: node scripts/verify-production.mjs

      - name: Scheduled production smoke test
        if: github.event_name != 'push'
        env:
          PRODUCTION_URL: https://arrival-confirmations.vercel.app
          VERIFY_ATTEMPTS: '1'
        run: node scripts/verify-production.mjs
