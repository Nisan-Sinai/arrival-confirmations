name: Report Premium coverage gaps

on:
  push:
    branches:
      - feat/complete-premium-event-tools

permissions:
  contents: write

jobs:
  report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key-0123456789
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-0123456789
      TOKEN_PEPPER: ci-placeholder-token-pepper-0123456789-abcdef
      IP_HASH_PEPPER: ci-placeholder-ip-pepper-9876543210-zyxwvu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/complete-premium-event-tools
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage || true

      - name: Write exact uncovered locations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('coverage/coverage-final.json').read_text())
          output = []
          for filename, data in sorted(report.items()):
              statements = []
              for key, count in data['s'].items():
                  if count == 0:
                      location = data['statementMap'][key]
                      statements.append(str(location['start']['line']))

              branches = []
              for key, counts in data['b'].items():
                  if any(count == 0 for count in counts):
                      location = data['branchMap'][key]
                      branches.append(
                          f"line {location['line']} type={location['type']} counts={counts}"
                      )

              if statements or branches:
                  output.append(filename)
                  if statements:
                      output.append('  statements: ' + ', '.join(statements))
                  for branch in branches:
                      output.append('  branch: ' + branch)

          Path('coverage-gaps.txt').write_text('\n'.join(output) + '\n')
          PY

      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage-gaps.txt
          git commit -m "chore: report exact coverage gaps"
          git push origin HEAD:feat/complete-premium-event-tools
