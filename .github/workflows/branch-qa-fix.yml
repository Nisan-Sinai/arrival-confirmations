name: Branch QA fix

on:
  push:
    branches:
      - feature/whatsapp-cloud-auto-send
    paths:
      - .github/workflows/branch-qa-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/whatsapp-cloud-auto-send
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Revert Next patch that breaks next/font build
        run: pnpm update next@16.3.6 eslint-config-next@16.3.6
      - name: Format repository
        run: pnpm format
      - name: Commit QA fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: apply QA formatting and restore stable Next patch"
          git push origin HEAD:feature/whatsapp-cloud-auto-send
