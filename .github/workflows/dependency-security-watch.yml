name: Central dependency security watch

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-watch
  cancel-in-progress: false

jobs:
  audit:
    uses: Nisan-Sinai/github-workflows/.github/workflows/dependency-watch.yml@c1c2dd6f344e7bb9626d4a57885bfd0d277cd0eb # main
    with:
      node-version: '24'
      package-manager: pnpm
      install-command: pnpm install --frozen-lockfile
      audit-command: pnpm test:dependency-audit && pnpm check:dependency-audit
