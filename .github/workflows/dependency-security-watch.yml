name: Dependency Security Watch

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-watch
  cancel-in-progress: true

jobs:
  audit:
    name: Full dependency vulnerability watch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install exact dependency graph
        run: pnpm install --frozen-lockfile

      - name: Detect newly disclosed vulnerabilities
        run: pnpm audit --audit-level=low
