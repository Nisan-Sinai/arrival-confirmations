name: Central dependency security watch

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-watch
  cancel-in-progress: false

jobs:
  audit:
    uses: Nisan-Sinai/github-workflows/.github/workflows/dependency-watch.yml@4785c2f8c13f9b81fc3507069e94aa2f9c22d752 # main
    with:
      node-version: '24'
      package-manager: pnpm
      install-command: pnpm install --frozen-lockfile
      audit-command: pnpm test:dependency-audit && pnpm check:dependency-audit
