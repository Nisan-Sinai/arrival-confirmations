name: Apply QA fixes once

on:
  push:
    branches: [qa/comprehensive-site-audit]
    paths:
      - '.github/workflows/qa-fix-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/comprehensive-site-audit

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply audited fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:100]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace(
              'app/page.tsx',
              "    body: 'רשימת האורחים גלויה לחשבון שיצר את האירוע בלבד, ונמחקת לאחר האירוע.',",
              "    body: 'רשימת האורחים גלויה לחשבון שיצר את האירוע בלבד, ונמחקת או עוברת אנונימיזציה בהתאם למדיניות הפרטיות.',",
          )

          replace(
              'app/page.tsx',
              "    a: 'הם נשמרים לצורך ארגון האירוע בלבד, גלויים רק לחשבון שיצר את האירוע, ונמחקים לאחריו. הפירוט המלא נמצא במדיניות הפרטיות.',",
              "    a: 'הם נשמרים לצורך ארגון האירוע בלבד, גלויים רק לחשבון שיצר את האירוע, ונמחקים או עוברים אנונימיזציה עד שנה לאחר האירוע, בהתאם למדיניות הפרטיות.',",
          )

          replace(
              'app/privacy/page.tsx',
              '''          <Section title="עוגיות">
            <p>
              האתר אינו משתמש בעוגיות פרסום או מעקב. עוגייה טכנית אחת נשמרת כשמשתמשים בקישור הזמנה
              אישי, כדי לזהות שאתם מי שקיבל אותו. היא נמחקת מעצמה.
            </p>
          </Section>''',
              '''          <Section title="עוגיות">
            <p>
              האתר אינו משתמש בעוגיות פרסום או מעקב. משתמשים שנכנסים לחשבון הניהול מקבלים עוגיות
              טכניות חיוניות של Supabase, שנועדו לשמור על ההתחברות ולאבטח את החשבון. הן פגות
              אוטומטית או נמחקות בעת ההתנתקות.
            </p>
            <p>
              אורחים שממלאים אישור הגעה דרך קישור האירוע אינם נדרשים להיכנס לחשבון, ולא נשמרת
              אצלם עוגיית פרסום או מעקב.
            </p>
          </Section>''',
          )

          replace(
              'app/dashboard/page.tsx',
              '''                    <Link
                      href={`/e/${event.public_id}`}
                      className="text-primary rounded-sm text-sm underline underline-offset-4"
                      dir="ltr"
                    >
                      /e/{event.public_id}
                    </Link>''',
              '''                    <Link
                      href={`/e/${event.public_id}`}
                      target="_blank"
                      rel="noopener noreferrer"
                      prefetch={false}
                      aria-label={`פתיחת ההזמנה של ${event.title} בכרטיסייה חדשה`}
                      className="text-primary inline-flex items-center gap-1.5 rounded-sm text-sm underline underline-offset-4"
                    >
                      <span dir="ltr">/e/{event.public_id}</span>
                      <svg
                        aria-hidden="true"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        strokeWidth={2}
                        strokeLinecap="round"
                        strokeLinejoin="round"
                        className="size-3.5 shrink-0"
                      >
                        <path d="M14 3h7v7M10 14 21 3" />
                        <path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5" />
                      </svg>
                    </Link>''',
          )

          marker = """  test('offers a route to sign in and to sign up', async ({ page }) => {
    await page.goto('/');
    // The header did not exist before the redesign; there was no navigation at all.
    await expect(page.getByRole('navigation', { name: 'ניווט ראשי' })).toBeVisible();
  });
"""
          addition = marker + """
  test('states the real retention window instead of implying immediate deletion', async ({ page }) => {
    await page.goto('/');
    await page.getByText('מה קורה לפרטים של האורחים?', { exact: true }).click();
    await expect(page.getByText(/עד שנה לאחר האירוע/)).toBeVisible();
  });
"""
          replace('e2e/invitation.spec.ts', marker, addition)

          marker = """test.describe('routes that used to 404', () => {
"""
          addition = """test.describe('legal copy accuracy', () => {
  test('describes the cookies the current product actually uses', async ({ page }) => {
    await page.goto('/privacy');
    await expect(page.getByText(/עוגיות טכניות חיוניות של Supabase/)).toBeVisible();
    await expect(page.locator('main')).not.toContainText('קישור הזמנה אישי');
  });
});

""" + marker
          replace('e2e/invitation.spec.ts', marker, addition)
          PY

      - name: Format changed files
        run: pnpm exec prettier --write app/page.tsx app/privacy/page.tsx app/dashboard/page.tsx e2e/invitation.spec.ts

      - name: Verify static quality gates
        run: pnpm check

      - name: Commit fixes and remove temporary workflow
        run: |
          rm .github/workflows/qa-fix-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/privacy/page.tsx app/dashboard/page.tsx e2e/invitation.spec.ts .github/workflows/qa-fix-once.yml
          git diff --cached --check
          git commit -m "fix(qa): align privacy copy and invite-link UX"
          git push origin qa/comprehensive-site-audit
