name: Dependabot Auto-Merge

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  actions: read
  checks: read
  contents: write
  pull-requests: write
  statuses: read

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Dependabot auto-merge gate
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Read verified Dependabot metadata
        id: dependabot-metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ github.token }}

      - name: Accept only patch and minor updates
        env:
          UPDATE_TYPE: ${{ steps.dependabot-metadata.outputs.update-type }}
        run: |
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor)
              echo "Eligible update type: $UPDATE_TYPE"
              ;;
            version-update:semver-major)
              echo "::notice::Major dependency updates require manual review."
              exit 1
              ;;
            *)
              echo "::error::Missing or unsupported Dependabot update type: ${UPDATE_TYPE:-<empty>}"
              exit 1
              ;;
          esac

      - name: Wait for exact CI and deployment gates, then squash merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          node <<'NODE'
          const repo = process.env.GITHUB_REPOSITORY;
          const prNumber = Number(process.env.PR_NUMBER);
          const expectedHead = process.env.EXPECTED_HEAD_SHA;
          const api = process.env.GITHUB_API_URL;
          const token = process.env.GH_TOKEN;

          const REQUIRED_CHECKS = [
            'Full Git history secret scan',
            'Production and full dependency audits',
            'Format, lint, types, unit tests',
            'Database, integration, RLS and 50-event matrix',
            'End-to-end and accessibility',
          ];
          const REQUIRED_STATUSES = ['Vercel'];
          const SELF_CHECKS = new Set(['Dependabot auto-merge gate']);
          const FAILURE_CONCLUSIONS = new Set([
            'failure',
            'cancelled',
            'timed_out',
            'action_required',
            'stale',
            'startup_failure',
          ]);
          const MAX_ATTEMPTS = 75;
          const INTERVAL_MS = 20_000;

          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function request(path, options = {}) {
            const response = await fetch(`${api}${path}`, {
              ...options,
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${token}`,
                'X-GitHub-Api-Version': '2022-11-28',
                ...(options.headers ?? {}),
              },
            });
            const text = await response.text();
            let body = null;
            if (text !== '') {
              try {
                body = JSON.parse(text);
              } catch {
                body = { message: text };
              }
            }
            return { response, body };
          }

          async function getJson(path) {
            const { response, body } = await request(path);
            if (!response.ok) {
              throw new Error(`GitHub API ${response.status} for ${path}: ${body?.message ?? 'unknown error'}`);
            }
            return body;
          }

          async function allCheckRuns(sha) {
            const rows = [];
            for (let page = 1; ; page += 1) {
              const body = await getJson(
                `/repos/${repo}/commits/${sha}/check-runs?per_page=100&page=${page}`,
              );
              rows.push(...body.check_runs);
              if (body.check_runs.length < 100) break;
            }
            return rows;
          }

          async function allStatuses(sha) {
            const rows = [];
            for (let page = 1; ; page += 1) {
              const body = await getJson(
                `/repos/${repo}/commits/${sha}/statuses?per_page=100&page=${page}`,
              );
              rows.push(...body);
              if (body.length < 100) break;
            }
            return rows;
          }

          function latestByName(rows, key) {
            const latest = new Map();
            for (const row of rows) {
              const name = row[key];
              const previous = latest.get(name);
              if (!previous || Number(row.id) > Number(previous.id)) latest.set(name, row);
            }
            return latest;
          }

          async function assertHeadAndBase() {
            const [pr, repository] = await Promise.all([
              getJson(`/repos/${repo}/pulls/${prNumber}`),
              getJson(`/repos/${repo}`),
            ]);

            if (pr.state !== 'open') throw new Error(`PR is ${pr.state}, not open.`);
            if (pr.draft) throw new Error('PR is still a draft.');
            if (pr.user?.login !== 'dependabot[bot]') throw new Error('PR author is not Dependabot.');
            if (pr.base?.ref !== repository.default_branch) {
              throw new Error(`PR base ${pr.base?.ref} is not default branch ${repository.default_branch}.`);
            }
            if (pr.head?.sha !== expectedHead) {
              throw new Error(`Head SHA changed from ${expectedHead} to ${pr.head?.sha}.`);
            }

            const comparison = await getJson(
              `/repos/${repo}/compare/${encodeURIComponent(repository.default_branch)}...${expectedHead}`,
            );
            if (comparison.behind_by !== 0) {
              throw new Error(`PR is behind ${repository.default_branch} by ${comparison.behind_by} commit(s).`);
            }
            if (pr.mergeable === false || pr.mergeable_state === 'dirty') {
              throw new Error('PR has a merge conflict.');
            }
            return pr;
          }

          for (let attempt = 1; attempt <= MAX_ATTEMPTS; attempt += 1) {
            await assertHeadAndBase();

            const [checkRuns, statuses] = await Promise.all([
              allCheckRuns(expectedHead),
              allStatuses(expectedHead),
            ]);
            const checks = latestByName(
              checkRuns.filter((run) => !SELF_CHECKS.has(run.name)),
              'name',
            );
            const statusMap = latestByName(statuses, 'context');

            const missingChecks = [];
            const pendingChecks = [];
            const failedChecks = [];
            for (const name of REQUIRED_CHECKS) {
              const run = checks.get(name);
              if (!run) {
                missingChecks.push(name);
                continue;
              }
              if (run.status !== 'completed' || run.conclusion === null) {
                pendingChecks.push(`${name}:${run.status}`);
                continue;
              }
              if (run.conclusion !== 'success') {
                failedChecks.push(`${name}:${run.conclusion}`);
              }
            }

            const missingStatuses = [];
            const pendingStatuses = [];
            const failedStatuses = [];
            for (const context of REQUIRED_STATUSES) {
              const status = statusMap.get(context);
              if (!status) {
                missingStatuses.push(context);
                continue;
              }
              if (status.state === 'pending') pendingStatuses.push(`${context}:pending`);
              else if (status.state !== 'success') failedStatuses.push(`${context}:${status.state}`);
            }

            for (const run of checkRuns) {
              if (SELF_CHECKS.has(run.name)) continue;
              if (run.status === 'completed' && FAILURE_CONCLUSIONS.has(run.conclusion)) {
                if (REQUIRED_CHECKS.includes(run.name) && !failedChecks.some((x) => x.startsWith(`${run.name}:`))) {
                  failedChecks.push(`${run.name}:${run.conclusion}`);
                }
              }
            }

            console.log(JSON.stringify({
              attempt,
              head: expectedHead,
              checks: Object.fromEntries(REQUIRED_CHECKS.map((name) => [
                name,
                checks.get(name) ? `${checks.get(name).status}/${checks.get(name).conclusion}` : 'missing',
              ])),
              statuses: Object.fromEntries(REQUIRED_STATUSES.map((name) => [
                name,
                statusMap.get(name)?.state ?? 'missing',
              ])),
              missingChecks,
              pendingChecks,
              failedChecks,
              missingStatuses,
              pendingStatuses,
              failedStatuses,
            }));

            if (failedChecks.length > 0 || failedStatuses.length > 0) {
              throw new Error(`A required gate failed: ${[...failedChecks, ...failedStatuses].join(', ')}`);
            }

            const ready =
              missingChecks.length === 0 &&
              pendingChecks.length === 0 &&
              missingStatuses.length === 0 &&
              pendingStatuses.length === 0;

            if (ready) {
              await assertHeadAndBase();
              const { response, body } = await request(`/repos/${repo}/pulls/${prNumber}/merge`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  sha: expectedHead,
                  merge_method: 'squash',
                }),
              });

              if (response.ok && body?.merged === true) {
                console.log(`Squash merged Dependabot PR at expected head ${expectedHead}: ${body.sha}`);
                process.exit(0);
              }

              if ([405, 409].includes(response.status)) {
                console.log(
                  `Merge is still blocked by repository rules/review state (${response.status}: ${body?.message ?? 'no message'}).`,
                );
              } else {
                throw new Error(
                  `Merge API failed (${response.status}): ${body?.message ?? 'unknown error'}`,
                );
              }
            }

            if (attempt < MAX_ATTEMPTS) await sleep(INTERVAL_MS);
          }

          throw new Error('Timed out before every required CI/deployment/repository gate became mergeable.');
          NODE
