name: Apply guest type compatibility

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    if: github.head_ref == 'feature/admin-customer-event-access'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply extended guest types
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path: str, replacements: list[tuple[str, str]]) -> None:
              file = Path(path)
              source = file.read_text()
              for old, new in replacements:
                  if old not in source:
                      raise SystemExit(f'missing replacement in {path}: {old[:80]!r}')
                  source = source.replace(old, new)
              file.write_text(source)

          patch('app/actions/adminGuestFileImport.ts', [
              ("import type { Database } from '@/types/database.types';", "import type { GuestInsert, GuestSupabaseClient } from '@/types/guestDatabase.types';"),
              ('const privileged = createPrivilegedClient();', 'const privileged = createPrivilegedClient() as unknown as GuestSupabaseClient;'),
              ("Database['public']['Tables']['guests']['Insert']", 'GuestInsert'),
          ])

          patch('app/actions/adminGuestImports.ts', [
              ("import type { Database } from '@/types/database.types';", "import type { GuestInsert, GuestSupabaseClient } from '@/types/guestDatabase.types';"),
              ('const privileged = createPrivilegedClient();', 'const privileged = createPrivilegedClient() as unknown as GuestSupabaseClient;'),
              ("Database['public']['Tables']['guests']['Insert']", 'GuestInsert'),
          ])

          patch('app/actions/manageAdminCustomerEvent.ts', [
              ("import type { Database } from '@/types/database.types';", "import type { Database, Json } from '@/types/database.types';\nimport type { GuestSupabaseClient, GuestUpdate } from '@/types/guestDatabase.types';"),
              ("type GuestWrite = Database['public']['Tables']['guests']['Update'];", 'type GuestWrite = GuestUpdate;'),
              ('  metadata: Record<string, unknown>;', '  metadata: Json;'),
              ('const privileged = createPrivilegedClient();', 'const privileged = createPrivilegedClient() as unknown as GuestSupabaseClient;'),
          ])

          patch('app/actions/manageGuests.ts', [
              ("import type { TypedSupabaseClient } from '@/lib/server/supabase';\nimport type { Database } from '@/types/database.types';", "import type { GuestInsert, GuestSupabaseClient, GuestUpdate } from '@/types/guestDatabase.types';"),
              ("type GuestWrite = Database['public']['Tables']['guests']['Update'];", 'type GuestWrite = GuestUpdate;'),
              ('async function requireOwnedEvent(eventId: string): Promise<TypedSupabaseClient | null> {', 'async function requireOwnedEvent(eventId: string): Promise<GuestSupabaseClient | null> {'),
              ("  const { data, error } = await supabase\n    .from('events')", "  const guestDb = supabase as unknown as GuestSupabaseClient;\n  const { data, error } = await guestDb\n    .from('events')"),
              ('  return error === null && data !== null ? supabase : null;', '  return error === null && data !== null ? guestDb : null;'),
              ("Database['public']['Tables']['guests']['Insert']", 'GuestInsert'),
          ])

          patch('app/admin/events/[id]/page.tsx', [
              ("import { createPrivilegedClient } from '@/lib/server/supabase';", "import { createPrivilegedClient } from '@/lib/server/supabase';\nimport type { GuestSupabaseClient } from '@/types/guestDatabase.types';"),
              ('  const privileged = createPrivilegedClient();', '  const privileged = createPrivilegedClient() as unknown as GuestSupabaseClient;'),
          ])

          patch('app/dashboard/events/[id]/guests/page.tsx', [
              ("import { createUserClient } from '@/lib/server/supabase';", "import { createUserClient } from '@/lib/server/supabase';\nimport type { GuestSupabaseClient } from '@/types/guestDatabase.types';"),
              ("  const [{ data: event }, { data: guests, error: guestsError }] = await Promise.all([\n    supabase.from('events')", "  const guestDb = supabase as unknown as GuestSupabaseClient;\n  const [{ data: event }, { data: guests, error: guestsError }] = await Promise.all([\n    guestDb.from('events')"),
              ("    supabase\n      .from('guests')", "    guestDb\n      .from('guests')"),
          ])

          patch('lib/server/currentInvite.ts', [
              ("import { createPrivilegedClient } from '@/lib/server/supabase';", "import { createPrivilegedClient } from '@/lib/server/supabase';\nimport type { GuestSupabaseClient } from '@/types/guestDatabase.types';"),
              ('  const privileged = createPrivilegedClient();', '  const privileged = createPrivilegedClient() as unknown as GuestSupabaseClient;'),
          ])
          PY
      - run: >-
          pnpm exec prettier --write
          app/actions/adminGuestFileImport.ts
          app/actions/adminGuestImports.ts
          app/actions/manageAdminCustomerEvent.ts
          app/actions/manageGuests.ts
          app/admin/events/[id]/page.tsx
          app/dashboard/events/[id]/guests/page.tsx
          lib/server/currentInvite.ts
          types/guestDatabase.types.ts
      - name: Commit compatibility changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app lib types/guestDatabase.types.ts
          git commit -m "fix: use extended guest database types"
          git push origin HEAD:${{ github.head_ref }}
