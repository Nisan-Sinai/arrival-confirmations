name: Fetch licensed editorial wedding photos (once)
on:
  push:
    branches: [feature/editorial-wedding-brand-20261104]
    paths: [.github/workflows/one-shot-editorial-photos.yml]

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download and validate licensed Unsplash images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/media
          curl --fail --location --retry 3 --silent --show-error \
            "https://images.unsplash.com/photo-1769812343775-85a27e6a076c?auto=format&fit=crop&crop=entropy&w=1200&h=1450&q=80&fm=webp" \
            -o public/media/wedding-reception.webp
          curl --fail --location --retry 3 --silent --show-error \
            "https://images.unsplash.com/photo-1768594266667-50aaa727ebf5?auto=format&fit=crop&crop=entropy&w=1150&h=820&q=78&fm=webp" \
            -o public/media/event-interior.webp
          for photo in public/media/*.webp; do
            test "$(file --brief --mime-type "$photo")" = "image/webp"
            test "$(stat -c%s "$photo")" -gt 20000
            test "$(stat -c%s "$photo")" -lt 2000000
            echo "$(basename "$photo"): $(stat -c%s "$photo") bytes"
          done
      - name: Commit optimized images on feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/media/wedding-reception.webp public/media/event-interior.webp
          if ! git diff --cached --quiet; then
            git commit -m "assets: add licensed optimized event photography"
            git push origin HEAD:refs/heads/feature/editorial-wedding-brand-20261104
          fi
