name: Production schema release diagnostic

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  production-schema-diagnostic:
    if: github.head_ref == 'ops/production-schema-release-20260802'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v2
        with:
          version: 2.101.0
          github-token: ${{ github.token }}

      - name: Detect safe Production migration credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          present() {
            if [ -n "${!1:-}" ]; then
              echo "✅ $1 is configured"
            else
              echo "⚪ $1 is not configured"
            fi
          }

          present SUPABASE_URL
          present SUPABASE_ACCESS_TOKEN
          present SUPABASE_DB_PASSWORD
          present SUPABASE_DB_URL
          present DATABASE_URL
          present TEST_DATABASE_URL
          present SUPABASE_PROJECT_REF
          present SUPABASE_PROJECT_ID

          if [ -n "${SUPABASE_URL:-}" ]; then
            derived_ref="$(printf '%s' "$SUPABASE_URL" | sed -E 's#https://([^.]+)\.supabase\.co.*#\1#')"
            echo "Derived project ref length: ${#derived_ref}"
          fi

          if [ -n "${SUPABASE_DB_URL:-}" ] || [ -n "${DATABASE_URL:-}" ] || [ -n "${TEST_DATABASE_URL:-}" ]; then
            echo "MIGRATION_PATH=db_url" >> "$GITHUB_ENV"
          elif [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] && [ -n "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "MIGRATION_PATH=linked_cli" >> "$GITHUB_ENV"
          elif [ -n "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "MIGRATION_PATH=management_api" >> "$GITHUB_ENV"
          else
            echo "MIGRATION_PATH=none" >> "$GITHUB_ENV"
          fi

      - name: Report selected migration path
        run: echo "Selected safe migration path: $MIGRATION_PATH"
