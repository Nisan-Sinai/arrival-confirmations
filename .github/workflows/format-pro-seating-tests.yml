name: Format Pro seating tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'feat/pro-seating-suite' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prettier --write tests/unit/lib/proSeating.test.ts lib/proSeating.ts
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/lib/proSeating.test.ts lib/proSeating.ts
          git diff --cached --quiet && exit 0
          git commit -m "style: format Pro seating coverage tests"
          git push origin HEAD:${{ github.head_ref }}
