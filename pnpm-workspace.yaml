allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver

# Security overrides for transitive dependencies that direct dependencies do not
# expose yet. Each override stays on the smallest compatible maintenance line.
# Verify every change with `pnpm audit`, the production build and the complete CI suite.
overrides:
  postcss: '^8.5.18'
  'next>sharp': '0.35.3'
  'brace-expansion@<1.1.18': '1.1.18'
  'brace-expansion@>=4.0.0 <5.0.9': '5.0.9'
  # Two advisories published against 6.14.2–6.15.3 (GHSA-x5fp-wj9c-mxmx and the
  # isBuffer denial of service) moved the ceiling past the 6.15.2 this used to pin.
  # Both name ">=6.15.4" as patched and no such version exists on npm, so 6.16.0 is
  # the smallest published fix rather than the smallest patch line. Reached only
  # through @stryker-mutator/core > typed-rest-client, so it is dev-only and the
  # production audit was never affected.
  'qs@>=6.11.1 <=6.15.3': '6.16.0'
  'nanoid@<3.3.18': '3.3.18'
  # Four high advisories land on 3.1.5, so this pin was exactly one version short:
  # GHSA-5jgf-p345-68v8, GHSA-f65p-4m7j-42xc, GHSA-fph4-wmhf-6fwf and
  # GHSA-jqff-g426-hqxp, all patched in 3.1.6.
  #
  # Note that `pnpm audit` reports this tree clean. It queries the npm registry's feed,
  # which had not picked these up; GitHub's advisory database had. The two disagree, so
  # a green `pnpm audit` is not on its own evidence that nothing is outstanding — check
  # the Dependabot alerts as well.
  'fast-uri@>=3.0.0 <3.1.6': '3.1.6'
  'js-yaml@>=4.0.0 <4.3.1': '4.3.1'
