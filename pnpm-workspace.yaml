allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver

# Security overrides for transitive dependencies that direct dependencies do not
# expose yet. Keep each override on the smallest compatible maintenance line and
# verify it with `pnpm audit`, the production build and the complete CI suite.
overrides:
  postcss: '^8.5.18'
  'next>sharp': '0.35.3'
  'brace-expansion@<1.1.17': '1.1.17'
